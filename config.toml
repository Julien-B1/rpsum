# Fournisseur et modèle par tâche. Surchargeable en CLI : --provider / --model.
# `rpsum models --task <tâche>` liste les modèles compatibles.

# Transcription : une seule des deux paires doit être active. Pour changer, commenter l'une et décommenter l'autre.
[tasks.transcribe]
provider = "mistral"
model = "voxtral-small-transcribe-3"
# provider = "elevenlabs"
# model = "scribe_v2"

# Lecture du fichier de contexte de campagne.
[tasks.context]
provider = "mistral"
model = "mistral-large-latest"

# Lecture des images (incrustations de la vidéo, images jointes au contexte).
[tasks.vision]
provider = "mistral"
model = "mistral-medium-latest"

[tasks.identify]
provider = "mistral"
model = "mistral-large-latest"

[tasks.summarize]
provider = "mistral"
model = "mistral-large-latest"

[tasks.extract]
provider = "mistral"
model = "mistral-large-latest"

[transcribe]
language = "fr"
# Mistral : taille cible des morceaux, en secondes (fenêtre de 65 536 tokens).
mistral_chunk_seconds = 1500

[run]
# Résumés produits par `rpsum run` : noms de préréglages de presets/.
presets = ["fiche"]
# Extraits audio des passages notés 8 et plus.
clips = true
